<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Signing in to Loomis</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        background: #0d0d0d;
        color: oklch(0.945 0 0);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
          Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: grid;
        place-items: center;
        text-align: center;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: enter 0.4s cubic-bezier(0.2, 0, 0, 1) both;
      }

      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .icon {
        width: 88px;
        height: 88px;
      }

      h1 {
        margin-top: 20px;
        font-size: 18px;
        font-weight: 400;
        letter-spacing: 0.01em;
        text-wrap: balance;
      }

      .open {
        margin-top: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 24px;
        border: none;
        border-radius: 9999px;
        background: oklch(0.885 0 0);
        color: oklch(0.212 0 0);
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        text-decoration: none;
        transition-property: background-color, scale;
        transition-duration: 0.15s;
        transition-timing-function: cubic-bezier(0.2, 0, 0, 1);
      }

      .open:hover {
        background: oklch(0.945 0 0);
      }

      .open:active {
        scale: 0.96;
      }

      .open:focus-visible {
        outline: 2px solid oklch(0.885 0 0);
        outline-offset: 3px;
      }

      .hint {
        margin-top: 16px;
        font-size: 13px;
        color: oklch(0.6 0 0);
        text-wrap: pretty;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="icon" src="icon.png" alt="Loomis" width="88" height="88" />
      <h1 id="status">Signing in…</h1>
      <a class="open" id="open" href="loomis://auth">Open Loomis</a>
      <p class="hint">Click the button if Loomis doesn't open automatically.</p>
    </main>
    <script>
      // Supabase's implicit flow returns the session in the URL fragment
      // (#access_token=…). Forward it verbatim to the app's deep link —
      // the fragment never reaches any server, only this page and the app.
      var target = "loomis://auth" + window.location.hash;
      var open = document.getElementById("open");
      open.href = target;

      if (window.location.hash.indexOf("error") !== -1) {
        document.getElementById("status").textContent = "Sign-in was cancelled";
      } else if (window.location.hash.length > 1) {
        window.location.href = target;
      }
    </script>
  </body>
</html>
